[project]
name = "the-distributor"
version = "0.1.0"
description = "Easily create custom distributions of apps, configs, and automations over multiple platforms with an optional TUI interface generated by Textualize"
authors = [{ name = "Garrett Anderson", email = "g@devnull.rip" }]
readme = "README.md"
requires-python = ">=3.14,<4.0"
dependencies = ["textual (>=8.0.0,<9.0.0)"]

[tool.poetry]
packages = [{ include = "the_distributor", from = "src" }]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = ["pytest (>=9.0.2,<10.0.0)", "textual-dev (>=1.8.0,<2.0.0)"]
